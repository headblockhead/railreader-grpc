syntax = "proto3";
option go_package = "github.com/headblockhead/railreader-grpc";

import "overviewRequest.proto";
import "darwin.proto";
import "routeLocation.proto";

message OverviewResponse {
    OverviewRequest request = 1;

    Schedule current_schedule = 2;
    optional Formation current_formation = 3;

    RouteLocation current_route_location = 4;

    repeated RouteLocation origin_route_locations = 5;
    repeated RouteLocaiton destination_route_locations = 6;
}
