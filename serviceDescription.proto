syntax = "proto3";
option go_package = "github.com/headblockhead/railreader-grpc";

import "railtypes.proto";

message ServiceDescription {
    Schedule schedule = 1;
    ScheduleLocation schedule_location = 2;
    Forecast forecast = 3;
    Formation formation = 4;
    FormationLoading formation_loading = 5;
    ServiceLoading service_loading = 6;
    TrainAlerts train_alerts = 7;

    Route forward_route = 8;
    Route reverse_route = 9;

    reserved 10 to 12;

    optional string generous_arrival_time = 13;
    optional string generous_passing_time = 14;
    optional string generous_departure_time = 15;
}

message Forecast { }
message Formation { }
message FormationLoading { }
message ServiceLoading { }
message TrainAlerts { }
message Route { }

message Schedule {
    reserved 1 to 3;
    string schedule_id = 4;
    string uid = 5;
    reserved 6 to 7;
    string headcode = 8;
    optional string retail_service_id = 9;
    string toc_id = 10;
    ServiceType service = 11;
    CategoryType category = 12;
    bool is_passenger_service = 13;
    bool is_active = 14;
    reserved 15;
    bool is_charter = 16;
    bool is_cancelled = 17;
    optional DisruptionReason cancellation_reason = 18;
    optional string diverted_via_location_id = 19;
    optional DisruptionReason diversion_reason = 20;
}

// 'Working' times are used internally by staff
// 'Public' times are used for display to passengers
// Working and Public timetables may differ, typically to allow services to experience very minor (30 to 60s) delays without appearing late to the public.
// There is no scheduled_public_passing_time because locations through which a service passes without stopping do not need to display any times to the public.
message ScheduleLocation {
    string uuid = 1;
    reserved 2 to 3;
    string location_id = 4;
    repeated ActivityType activities = 5;
    repeated ActivityType planned_activities = 6;
    reserved 7;
    bool is_affected_by_diversion = 8;
    LocationType type = 9;
    optional string working_arrival_time = 10;
    optional string working_passing_time = 11; 
    optional string working_departure_time = 12;
    optional string public_arrival_time = 13; 
    optional string public_departure_time = 14;
    uint32 routing_delay = 15; // in minutes
    reserved 16;
    bool is_cancelled = 17;
    optional DisruptionReason location_cancellation_reason = 18;
    reserved 19;
}

// estimated_public_*_time and estimated_working_*_time are Darwin's estimations of the most likely times.
// estimated_minimum_*_time is Darwin's estimation of the first possible times.
// actual_*_time are time reports from the physical train
message Forecast {
    bool is_reverse_formation = 1;
    optional DisruptionReason schedule_late_reason = 2;

    optional string estimated_public_arrival_time = 3; 
    optional string estimated_working_arrival_time = 4;
    optional string estimated_minimum_arrival_time = 5;
    optional bool arrival_is_delayed = 6;
    optional bool arrival_is_delayed_by_unknown_amount = 7;
    optional string estimated_passing_time = 8;
    optional string estimated_minimum_passing_time = 9;
    optional bool passing_is_delayed = 10;
    optional bool passing_is_delayed_by_unknown_amount = 11;
    optional string estimated_public_departure_time = 12; 
    optional string estimated_working_departure_time = 13;
    optional string estimated_minimum_departure_time = 14;
    optional bool departure_is_delayed = 15;
    optional bool departure_is_delayed_by_unknown_amount = 16;

    optional string actual_arrival_time = 17;
    optional string actual_arrival_data_class = 18;
    optional string actual_arrival_data_source = 19;
    optional string actual_arrival_data_source_system = 20;
    optional string actual_passing_time = 21; 
    optional string actual_passing_data_class = 22;
    optional string actual_passing_data_source = 23;
    optional string actual_passing_data_source_system = 24;
    optional string actual_departure_time = 25; 
    optional string actual_departure_data_class = 26;
    optional string actual_departure_data_source = 27;
    optional string actual_departure_data_source_system = 28;
  
    optional DisruptionReason location_late_reason = 29;
    optional string location_disruption_risk = 30;
    optional DisruptionReason location_disruption_risk_reason = 31;

    optional string affected_by = 32;

    optional bool platform_is_suppressed = 33; // do not display platform information if true
    optional bool platform_is_suppressed_by_cis = 34;
    enum PlatformDataSource {
        PLATFORM_DATA_SOURCE_PLATFORM_UNKNOWN = 0;
        PLATFORM_DATA_SOURCE_PLATFORM_PLANNED = 1;
        PLATFORM_DATA_SOURCE_PLATFORM_AUTOMATIC = 2;
        PLATFORM_DATA_SOURCE_PLATFORM_MANUAL = 3;
    }
    optional PlatformDataSource platform_data_source = 35;
    optional bool platform_is_confirmed = 36;

    bool service_is_suppressed = 37;
    bool service_detatches_from_front = 38;
}

message DisruptionReason {
    uint32 reason_id = 1;
    optional string reason_location_id = 2;
    // When true, the provided reason_id is 'near to' the provided reason_location_id. 
    // When false, the reason_id is 'at' the reason_location_id.
    bool reason_is_near_location = 3;  
}
