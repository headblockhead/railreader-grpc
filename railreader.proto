syntax = "proto3";
option go_package = "github.com/headblockhead/railreader-grpc";

import "locationUpdates.proto";
import "schedulesAtLocation.proto";

// All time-based properties are strings formatted as in IETF RFC 3339.

service RailReader {
  rpc GetLocationUpdates(LocationUpdatesRequest) returns (LocationUpdateResponse) {}
  rpc GetSchedulesAtLocation(SchedulesAtLocationRequest) returns (stream SchedulesAtLocationResponse) {}
}
