syntax = "proto3";
option go_package = "github.com/headblockhead/railreader-grpc";

import "describeRequest.proto";
import "darwin.proto";
import "routeLocation.proto";

message DescribeResponse {
    DescribeRequest request = 1;

    repeated Schedule schedules = 2;
    repeated Formation formations = 3;

    repeated RouteLocation route = 4;
}
